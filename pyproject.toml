[project]
name = "icml26-repro-self-distillation"
version = "0.3.0"
description = "Independent CPU reproduction of Optimal Unconstrained Self-Distillation in Ridge Regression (MdHcU4C4Rm / arXiv 2602.17565)."
requires-python = ">=3.12"
dependencies = [
    "numpy==2.3.5",
    "scipy==1.17.1",
    "pandas==3.0.3",
    "matplotlib==3.11.0",
    "ucimlrepo>=0.0.7",
]
# Claim 6 (CIFAR10) consumes committed pretrained ResNet-18 features
# (data/cifar10_resnet18_features.npz); torch is NOT needed at runtime. The
# extraction script reproduction/extract_cifar10_features.py documents how to
# regenerate those features with a separate torch environment.

[tool.uv]
# Frozen, reproducible environment. uv.lock is the source of truth; reproduce
# with `uv sync --frozen`.


