[project]
name = "icml26-repro-self-distillation"
version = "0.2.0"
description = "Independent CPU reproduction of Optimal Unconstrained Self-Distillation in Ridge Regression (MdHcU4C4Rm / arXiv 2602.17565)."
requires-python = ">=3.12"
dependencies = [
    "numpy==2.3.5",
    "scipy==1.17.1",
    "pandas==3.0.3",
    "matplotlib==3.11.0",
    "ucimlrepo>=0.0.7",
]

[tool.uv]
# Frozen, reproducible environment shared by every experiment node.
# Lockfile (uv.lock) is the source of truth; `uv sync --frozen` reproduces it exactly.
